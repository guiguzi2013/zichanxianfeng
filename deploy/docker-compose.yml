# ============================================================
# 资产先锋 docker-compose
# 用法：
#   cd deploy
#   cp .env.example .env   # 填 SECRET_KEY / DEEPSEEK_API_KEY / QCC_TOKEN
#   docker compose up -d --build
# 访问 http://<服务器IP>:8000
#
# 迁机/迁回国内：数据全在命名卷 zxf-data（= /app/backend/data）
#   备份：docker run --rm -v zxf-data:/data -v $PWD:/out alpine tar czf /out/zxf-data.tgz -C /data .
#   恢复：docker run --rm -v zxf-data:/data -v $PWD:/out alpine tar xzf /out/zxf-data.tgz -C /data
# 正式上线（域名 + HTTPS/备案后）：见 deploy/部署与迁移说明.md「nginx + HTTPS」一节
# ============================================================
services:
  zichanxianfeng:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: zichanxianfeng:latest
    container_name: zxf
    restart: unless-stopped
    ports:
      - "${ZXF_PORT:-8000}:8000"
    environment:
      # 安全（生产必须改：openssl rand -hex 32）
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      # LLM：真实模型填 DEEPSEEK_API_KEY 且 LLM_MOCK=false；演示/无 Key 留空即可（默认 mock）
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      LLM_MOCK: ${LLM_MOCK:-true}
      # 数据库：SQLite 在 data 卷内，随卷整体迁移（未来大流量可切 PostgreSQL）
      DATABASE_URL: sqlite:///./data/app.db
      # 企查查 MCP（账号 token；空则回退代码内旧 token）
      QCC_TOKEN: ${QCC_TOKEN:-}
      # 业务参数
      LPR_RATE: ${LPR_RATE:-0.0345}
    volumes:
      # 全部运行数据（app.db / uploads / pdf / fonts / llm_constraints.md）→ 命名卷
      - zxf-data:/app/backend/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  zxf-data:
