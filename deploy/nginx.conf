# 资产先锋 Nginx 反代（正式上线用：域名 + 备案 + HTTPS）
# 单进程后端已托管前端静态，nginx 只做 80/443 终结 + 反代 backend:8000
#
# 使用：正式上线时把 nginx 服务加入 deploy/docker-compose.yml（见部署与迁移说明.md），
# 或用宿主机 nginx：把下面 server 段放入 /etc/nginx/conf.d/zxf.conf，
# upstream 指向 127.0.0.1:8000（docker 映射端口）。

upstream zxf_backend {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name _;   # 部署时替换为真实域名（备案后）

    # certbot 验证目录（申请 HTTPS 时用）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 全部请求反代给后端（后端已托管 SPA 静态 + /api）
    location / {
        proxy_pass http://zxf_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;      # 尽调/报告任务可能耗时较长
        client_max_body_size 50m;     # 补充材料 / Excel 上传
    }
}

